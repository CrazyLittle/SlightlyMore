## Settings file was created by plugin EmpressLateJoin v2.0.6
## Plugin GUID: empress.repo.empresslatejoin

[General]

## Master switch for EmpressLateJoin.
# Setting type: Boolean
# Default value: true
Enabled = true

## Keeps the active multiplayer room joinable after the host starts the run.
# Setting type: Boolean
# Default value: true
KeepRoomJoinable = true

## Lets mid-level joiners load straight into the active scene and replay the missing live state from the host.
# Setting type: Boolean
# Default value: true
LiveJoinActiveLevels = true

[Truck]

## How long EmpressLateJoin waits after the truck starts before forcing the same transition as the /level next debug command if vanilla did not switch scenes.
# Setting type: Single
# Default value: 8
TruckStartFallbackDelay = 8

[WaitingRoom]

## Parks mid-level late joiners in the Empress holding cell and lets them enter normal play on the next scene.
# Setting type: Boolean
# Default value: true
QueueDuringActiveLevels = true

## How far a waiting player can stray from the holding cell anchor before EmpressLateJoin snaps them back.
# Setting type: Single
# Default value: 7
WaitingLeashRadius = 7

## Minimum delay between holding-cell snapbacks.
# Setting type: Single
# Default value: 0.75
WaitingSnapCooldown = 0.75

## Minimum amount of time EmpressLateJoin waits for a late joiner to settle before allowing the next scene switch.
# Setting type: Single
# Default value: 1.25
SceneSwitchSettleDelay = 1.25

## Maximum amount of time EmpressLateJoin will delay a scene switch while a late joiner settles.
# Setting type: Single
# Default value: 8
SceneSwitchSettleTimeout = 8

